name: Qwen Web Stages 2-9 Verify

on:
  push:
    branches:
      - feat/qwen-web-browser-provider
    paths:
      - '.github/workflows/qwen-web-stage2-verify.yml'
      - 'packages/core/src/core/qwenWebContentGenerator/**'
      - 'packages/core/src/models/**'
      - 'packages/core/src/index.ts'
      - 'packages/cli/src/utils/cleanup.ts'
      - 'packages/cli/src/utils/qwen-web-cleanup.test.ts'
      - 'packages/cli/src/ui/auth/**'
      - 'packages/cli/src/ui/components/AppHeader.tsx'
      - 'packages/cli/src/ui/components/AppHeader.test.tsx'
      - 'packages/cli/src/ui/opentui/dialogs-auth.tsx'
      - 'packages/cli/src/ui/opentui/dialogs-auth.test.tsx'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Focused Qwen Web core tests
        run: npm -w packages/core test -- src/core/qwenWebContentGenerator/browser/controller.test.ts src/core/qwenWebContentGenerator/browser/pageRuntime.browser.test.ts src/core/qwenWebContentGenerator/browser/sharedAuthenticationTask.test.ts src/core/qwenWebContentGenerator/browserService.test.ts src/core/qwenWebContentGenerator/conversationSynchronizer.test.ts src/core/qwenWebContentGenerator/qwenWebContentGenerator.transportReset.test.ts src/core/qwenWebContentGenerator/qwenWebContentGenerator.dirtyReplay.test.ts src/core/qwenWebContentGenerator/qwenWebContentGenerator.lifecycle.test.ts src/core/qwenWebContentGenerator/lifecycle.test.ts src/core/qwenWebContentGenerator/qwenWebContentGenerator.integration.test.ts
      - name: Focused Qwen Web CLI tests
        run: npm -w packages/cli test -- src/utils/qwen-web-cleanup.test.ts src/ui/auth/qwenWebAuth.test.ts src/ui/auth/AuthDialog.test.tsx src/ui/components/AppHeader.test.tsx src/ui/opentui/dialogs-auth.test.tsx
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck

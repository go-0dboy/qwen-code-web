name: Qwen Web Stages 2-6 Verify

on:
  push:
    branches:
      - feat/qwen-web-browser-provider
    paths:
      - '.github/workflows/qwen-web-stage2-verify.yml'
      - 'packages/core/src/core/qwenWebContentGenerator/browser/**'
      - 'packages/core/src/core/qwenWebContentGenerator/browserService.ts'
      - 'packages/core/src/core/qwenWebContentGenerator/browserService.test.ts'
      - 'packages/core/src/core/qwenWebContentGenerator/conversationSynchronizer.ts'
      - 'packages/core/src/core/qwenWebContentGenerator/conversationSynchronizer.test.ts'
      - 'packages/core/src/core/qwenWebContentGenerator/qwenWebContentGenerator.ts'
      - 'packages/core/src/core/qwenWebContentGenerator/qwenWebContentGenerator.transportReset.test.ts'
      - 'packages/core/src/core/qwenWebContentGenerator/qwenWebContentGenerator.dirtyReplay.test.ts'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Focused Qwen Web tests
        run: npm -w packages/core test -- src/core/qwenWebContentGenerator/browser/controller.test.ts src/core/qwenWebContentGenerator/browser/pageRuntime.browser.test.ts src/core/qwenWebContentGenerator/browser/sharedAuthenticationTask.test.ts src/core/qwenWebContentGenerator/browserService.test.ts src/core/qwenWebContentGenerator/conversationSynchronizer.test.ts src/core/qwenWebContentGenerator/qwenWebContentGenerator.transportReset.test.ts src/core/qwenWebContentGenerator/qwenWebContentGenerator.dirtyReplay.test.ts
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck

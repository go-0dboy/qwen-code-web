name: Qwen Web Kebab Migration

on:
  push:
    branches:
      - feat/qwen-web-browser-provider
    paths:
      - '.github/workflows/qwen-web-kebab-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Rename Qwen Web files and imports
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          renames = {
              'packages/cli/src/ui/auth/qwenWebAuth.ts': 'packages/cli/src/ui/auth/qwen-web-auth.ts',
              'packages/cli/src/ui/auth/qwenWebAuth.test.ts': 'packages/cli/src/ui/auth/qwen-web-auth.test.ts',
              'packages/core/src/core/qwenWebContentGenerator/browser/pageRuntime.ts': 'packages/core/src/core/qwenWebContentGenerator/browser/page-runtime.ts',
              'packages/core/src/core/qwenWebContentGenerator/browser/pageRuntime.browser.test.ts': 'packages/core/src/core/qwenWebContentGenerator/browser/page-runtime.browser.test.ts',
              'packages/core/src/core/qwenWebContentGenerator/browser/sharedAuthenticationTask.ts': 'packages/core/src/core/qwenWebContentGenerator/browser/shared-authentication-task.ts',
              'packages/core/src/core/qwenWebContentGenerator/browser/sharedAuthenticationTask.test.ts': 'packages/core/src/core/qwenWebContentGenerator/browser/shared-authentication-task.test.ts',
              'packages/core/src/core/qwenWebContentGenerator/browserService.ts': 'packages/core/src/core/qwenWebContentGenerator/browser-service.ts',
              'packages/core/src/core/qwenWebContentGenerator/browserService.test.ts': 'packages/core/src/core/qwenWebContentGenerator/browser-service.test.ts',
              'packages/core/src/core/qwenWebContentGenerator/conversationSynchronizer.ts': 'packages/core/src/core/qwenWebContentGenerator/conversation-synchronizer.ts',
              'packages/core/src/core/qwenWebContentGenerator/conversationSynchronizer.test.ts': 'packages/core/src/core/qwenWebContentGenerator/conversation-synchronizer.test.ts',
              'packages/core/src/core/qwenWebContentGenerator/promptSerializer.ts': 'packages/core/src/core/qwenWebContentGenerator/prompt-serializer.ts',
              'packages/core/src/core/qwenWebContentGenerator/promptSerializer.test.ts': 'packages/core/src/core/qwenWebContentGenerator/prompt-serializer.test.ts',
              'packages/core/src/core/qwenWebContentGenerator/qwenWebContentGenerator.ts': 'packages/core/src/core/qwenWebContentGenerator/qwen-web-content-generator.ts',
              'packages/core/src/core/qwenWebContentGenerator/qwenWebContentGenerator.dirtyReplay.test.ts': 'packages/core/src/core/qwenWebContentGenerator/qwen-web-content-generator.dirty-replay.test.ts',
              'packages/core/src/core/qwenWebContentGenerator/qwenWebContentGenerator.integration.test.ts': 'packages/core/src/core/qwenWebContentGenerator/qwen-web-content-generator.integration.test.ts',
              'packages/core/src/core/qwenWebContentGenerator/qwenWebContentGenerator.lifecycle.test.ts': 'packages/core/src/core/qwenWebContentGenerator/qwen-web-content-generator.lifecycle.test.ts',
              'packages/core/src/core/qwenWebContentGenerator/qwenWebContentGenerator.transportReset.test.ts': 'packages/core/src/core/qwenWebContentGenerator/qwen-web-content-generator.transport-reset.test.ts',
              'packages/core/src/core/qwenWebContentGenerator/qwenWebSecurity.test.ts': 'packages/core/src/core/qwenWebContentGenerator/qwen-web-security.test.ts',
              'packages/core/src/core/qwenWebContentGenerator/responseFactory.ts': 'packages/core/src/core/qwenWebContentGenerator/response-factory.ts',
              'packages/core/src/core/qwenWebContentGenerator/toolProtocol.ts': 'packages/core/src/core/qwenWebContentGenerator/tool-protocol.ts',
              'packages/core/src/core/qwenWebContentGenerator/toolProtocol.test.ts': 'packages/core/src/core/qwenWebContentGenerator/tool-protocol.test.ts',
              'packages/core/src/models/qwenWebModelContract.test.ts': 'packages/core/src/models/qwen-web-model-contract.test.ts',
          }

          for old, new in renames.items():
              src, dst = Path(old), Path(new)
              if src.exists():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  src.rename(dst)

          replacements = {
              'qwenWebAuth.js': 'qwen-web-auth.js',
              'pageRuntime.js': 'page-runtime.js',
              'sharedAuthenticationTask.js': 'shared-authentication-task.js',
              'browserService.js': 'browser-service.js',
              'conversationSynchronizer.js': 'conversation-synchronizer.js',
              'promptSerializer.js': 'prompt-serializer.js',
              'qwenWebContentGenerator.js': 'qwen-web-content-generator.js',
              'responseFactory.js': 'response-factory.js',
              'toolProtocol.js': 'tool-protocol.js',
              'pageRuntime.browser.test.ts': 'page-runtime.browser.test.ts',
              'sharedAuthenticationTask.test.ts': 'shared-authentication-task.test.ts',
              'browserService.test.ts': 'browser-service.test.ts',
              'conversationSynchronizer.test.ts': 'conversation-synchronizer.test.ts',
              'promptSerializer.test.ts': 'prompt-serializer.test.ts',
              'qwenWebContentGenerator.dirtyReplay.test.ts': 'qwen-web-content-generator.dirty-replay.test.ts',
              'qwenWebContentGenerator.integration.test.ts': 'qwen-web-content-generator.integration.test.ts',
              'qwenWebContentGenerator.lifecycle.test.ts': 'qwen-web-content-generator.lifecycle.test.ts',
              'qwenWebContentGenerator.transportReset.test.ts': 'qwen-web-content-generator.transport-reset.test.ts',
              'qwenWebSecurity.test.ts': 'qwen-web-security.test.ts',
              'qwenWebAuth.test.ts': 'qwen-web-auth.test.ts',
          }

          roots = [Path('packages'), Path('.github/workflows')]
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.yml', '.yaml'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  new = text
                  for old, repl in replacements.items():
                      new = new.replace(old, repl)
                  if new != text:
                      path.write_text(new, encoding='utf-8')

          auth_dialog = Path('packages/cli/src/ui/auth/AuthDialog.tsx')
          text = auth_dialog.read_text(encoding='utf-8')
          text = text.replace(
              "import { AuthType } from '@qwen-code/qwen-code-core';",
              "import { AuthType } from '@qwen-code/qwen-code-core/utils/auth-type.js';",
          )
          auth_dialog.write_text(text, encoding='utf-8')

          qwen_auth = Path('packages/cli/src/ui/auth/qwen-web-auth.ts')
          text = qwen_auth.read_text(encoding='utf-8')
          old = """import {\n  AuthType,\n  QWEN_WEB_DEFAULT_MODEL,\n  applyProviderInstallPlan,\n  type Config,\n  type ProviderInstallPlan,\n} from '@qwen-code/qwen-code-core';"""
          new = """import type { Config } from '@qwen-code/qwen-code-core/config/config.js';\nimport { QWEN_WEB_DEFAULT_MODEL } from '@qwen-code/qwen-code-core/models/index.js';\nimport { applyProviderInstallPlan } from '@qwen-code/qwen-code-core/providers/install.js';\nimport type { ProviderInstallPlan } from '@qwen-code/qwen-code-core/providers/types.js';\nimport { AuthType } from '@qwen-code/qwen-code-core/utils/auth-type.js';"""
          if old not in text:
              raise SystemExit('expected qwen-web-auth root import block not found')
          qwen_auth.write_text(text.replace(old, new), encoding='utf-8')
          PY
          npx eslint packages/core/src/core/qwenWebContentGenerator packages/core/src/models/qwen-web-model-contract.test.ts packages/cli/src/ui/auth --ext .ts,.tsx --fix
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No migration changes.'
            exit 0
          fi
          git config user.name 'go-0dboy'
          git config user.email '84291994+go-0dboy@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(qwen-web): align filenames with repository conventions'
          git push origin HEAD:feat/qwen-web-browser-provider

# Retry trigger after fixing the integration harness prefer-const violation.

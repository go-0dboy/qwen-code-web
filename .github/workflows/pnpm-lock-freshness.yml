name: 'pnpm Lock Freshness'

# The version agreement gate in scripts/check-lockfile.js is set membership:
# it catches a pnpm resolution npm never locked, but not a stale one whose
# superseded version still exists elsewhere in npm's tree. Only regenerating
# the lockfile proves it is current, and that needs registry metadata — so it
# runs here, on dependency changes only, instead of in the full-profile lane
# every non-docs PR pays for.

on:
  pull_request:
    branches:
      - 'main'
      - 'release/**'
    paths:
      - '.github/workflows/pnpm-lock-freshness.yml'
      - '.npmrc'
      - '.pnpmfile.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - '!packages/desktop-shell/package.json'
      - '!packages/live-host/package.json'
      - 'packages/channels/*/package.json'
      - 'integrations/*/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/pnpm-lock-freshness.yml'
      - '.npmrc'
      - '.pnpmfile.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - '!packages/desktop-shell/package.json'
      - '!packages/live-host/package.json'
      - 'packages/channels/*/package.json'
      - 'integrations/*/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

permissions:
  contents: 'write'

jobs:
  import:
    name: 'Lockfile freshness'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - name: 'Set up Node.js 22.x'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22.x'

      - name: 'Regenerate the pnpm lockfile from package-lock.json'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: 'corepack pnpm import'

      - name: 'Upload regenerated pnpm lockfile'
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # v4
        with:
          name: 'regenerated-pnpm-lock'
          path: 'pnpm-lock.yaml'
          if-no-files-found: 'error'
          retention-days: 1

      - name: 'Commit regenerated lockfile to this PR branch'
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: '${{ github.head_ref }}'
        shell: 'bash'
        run: |
          git fetch origin main "$HEAD_REF"
          git checkout "$HEAD_REF"
          corepack pnpm import
          # Remove this temporary repair workflow in the same bot commit.
          git checkout origin/main -- .github/workflows/pnpm-lock-freshness.yml
          if git diff --quiet -- pnpm-lock.yaml .github/workflows/pnpm-lock-freshness.yml; then
            echo 'Nothing to repair.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/pnpm-lock-freshness.yml
          git commit -m 'chore: refresh pnpm lockfile'
          git push origin "HEAD:$HEAD_REF"

      - name: 'Compare with the committed lockfile'
        shell: 'bash'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is what corepack pnpm import produces.'
            exit 0
          fi
          echo 'pnpm-lock.yaml is stale: it is not what `corepack pnpm import`'
          echo 'produces from the committed package-lock.json. Update the npm'
          echo 'lockfile first, then run `corepack pnpm import` and commit both.'
          git diff --stat -- pnpm-lock.yaml
          exit 1

          runtime.write_text(text)

          Path('packages/core/src/core/qwenWebContentGenerator/browser/controller.test.ts').write_text(r'''/**
           * @license
           * Copyright 2026 Qwen Team
           * SPDX-License-Identifier: Apache-2.0
           */

          import { describe, expect, it } from 'vitest';
          import {
            buildQwenWebBrowserLaunchOptions,
            qwenWebModelLabelMatches,
          } from './controller.js';

          describe('Qwen Web browser controller launch contract', () => {
            it('uses long CDP timeout, disables signal ownership and background throttling', () => {
              const options = buildQwenWebBrowserLaunchOptions(
                '/browser',
                '/profile',
                true,
              );
              expect(options.protocolTimeout).toBe(30 * 60_000);
              expect(options.handleSIGINT).toBe(false);
              expect(options.handleSIGTERM).toBe(false);
              expect(options.handleSIGHUP).toBe(false);
              expect(options.defaultViewport).toBeNull();
              expect(options.args).toEqual(
                expect.arrayContaining([
                  '--disable-background-timer-throttling',
                  '--disable-backgrounding-occluded-windows',
                  '--disable-renderer-backgrounding',
                ]),
              );
            });

            it('accepts decorated UI labels without allowing a different model family', () => {
              expect(
                qwenWebModelLabelMatches('Qwen3.8-Max · Latest', 'qwen3.8-max'),
              ).toBe(true);
              expect(
                qwenWebModelLabelMatches('Qwen3.8-Plus', 'qwen3.8-max'),
              ).toBe(false);
            });
          });
          ''')

          Path('packages/core/src/core/qwenWebContentGenerator/browser/pageRuntime.browser.test.ts').write_text(r'''/**
           * @license
           * Copyright 2026 Qwen Team
           * SPDX-License-Identifier: Apache-2.0
           */

          import puppeteer, { type Browser, type Page } from 'puppeteer-core';
          import { afterAll, beforeAll, describe, expect, it } from 'vitest';
          import { installQwenWebPageRuntime } from './pageRuntime.js';
          import type { QwenWebPageBridge } from './types.js';

          type BridgeWindow = Window & { __qwenCodeWebBridge?: QwenWebPageBridge };
          const executablePath = process.env['QWEN_WEB_TEST_BROWSER_PATH'];
          const browserDescribe = executablePath ? describe : describe.skip;

          browserDescribe('Qwen Web page runtime in Chromium', () => {
            let browser: Browser;

            beforeAll(async () => {
              if (!executablePath) throw new Error('QWEN_WEB_TEST_BROWSER_PATH is required.');
              browser = await puppeteer.launch({
                executablePath,
                headless: true,
                args: ['--no-sandbox', '--disable-setuid-sandbox'],
              });
            });

            afterAll(async () => {
              await browser?.close();
            });

            const createPage = async (html: string): Promise<Page> => {
              const page = await browser.newPage();
              await page.setContent(html);
              await page.evaluate(installQwenWebPageRuntime, {
                loginStabilityMs: 25,
                loginDetectionTimeoutMs: 500,
              });
              return page;
            };

            const status = async (page: Page) =>
              page.evaluate(async () => {
                const bridge = (window as BridgeWindow).__qwenCodeWebBridge;
                if (!bridge) throw new Error('bridge missing');
                return bridge.getStatus();
              });

            it('preserves multiline response text and uses only the first matching selector family', async () => {
              const page = await createPage(`
                <div class="avatar" style="width:20px;height:20px">account</div>
                <div class="response-message-content phase-answer" style="width:500px;height:100px"><pre>line one\n    indented line\nline three</pre></div>
                <div class="chat-response-message" style="width:500px;height:40px">fallback duplicate</div>
              `);
              const current = await status(page);
              expect(current.responseCount).toBe(1);
              expect(current.responseText).toContain('line one\n    indented line\nline three');
              expect(current.responseText).not.toContain('fallback duplicate');
              await page.close();
            });

            it('stabilizes input-only login detection but rejects an explicit sign-in page', async () => {
              const loggedInPage = await createPage(
                '<textarea style="width:300px;height:80px"></textarea>',
              );
              expect((await status(loggedInPage)).loggedIn).toBe(true);
              await loggedInPage.close();

              const loginPage = await createPage(`
                <textarea style="width:300px;height:80px"></textarea>
                <button style="width:100px;height:30px">Sign in</button>
              `);
              expect((await status(loginPage)).loggedIn).toBe(false);
              await loginPage.close();
            });

            it('ignores the permanent Web Search control but detects a native tool inside the response', async () => {
              const page = await createPage(`
                <div class="avatar" style="width:20px;height:20px">account</div>
                <button data-testid="web-search" style="width:100px;height:30px">Web Search</button>
                <div id="answer" class="response-message-content phase-answer" style="width:500px;height:100px">answer</div>
              `);
              expect((await status(page)).nativeToolVisible).toBe(false);
              await page.evaluate(() => {
                const answer = document.querySelector('#answer');
                const tool = document.createElement('div');
                tool.setAttribute('data-testid', 'tool-call');
                tool.setAttribute('style', 'width:200px;height:30px');
                tool.textContent = 'Searching the web';
                answer?.append(tool);
              });
              expect((await status(page)).nativeToolVisible).toBe(true);
              await page.close();
            });

            it('recognizes a decorated Qwen3.8-Max label as the requested model', async () => {
              const page = await createPage(`
                <div class="avatar" style="width:20px;height:20px">account</div>
                <button style="width:220px;height:30px">Qwen3.8-Max · Latest</button>
              `);
              const selected = await page.evaluate(async () => {
                const bridge = (window as BridgeWindow).__qwenCodeWebBridge;
                if (!bridge) throw new Error('bridge missing');
                return bridge.selectModel('qwen3.8-max');
              });
              expect(selected).toContain('Qwen3.8-Max');
              await page.close();
            });

            it('never completes a closed invoke while the Stop control is still active', async () => {
              const page = await createPage(`
                <div class="avatar" style="width:20px;height:20px">account</div>
                <textarea style="width:300px;height:80px"></textarea>
              `);
              const responsePromise = page.evaluate(async () => {
                const bridge = (window as BridgeWindow).__qwenCodeWebBridge;
                if (!bridge) throw new Error('bridge missing');
                return bridge.waitForResponse({
                  baselineCount: 0,
                  baselineText: '',
                  accepted: true,
                });
              });
              await page.evaluate(() => {
                const response = document.createElement('div');
                response.className = 'response-message-content phase-answer';
                response.setAttribute('style', 'width:500px;height:100px');
                response.innerHTML = '<pre>&lt;invoke name="read_file"&gt;&lt;parameter name="file_path"&gt;a.ts&lt;/parameter&gt;&lt;/invoke&gt;</pre>';
                document.body.append(response);
                const stop = document.createElement('button');
                stop.className = 'stop-button';
                stop.setAttribute('style', 'width:100px;height:30px');
                stop.textContent = 'Stop';
                document.body.append(stop);
              });
              const early = await Promise.race([
                responsePromise.then(() => 'resolved'),
                new Promise<string>((resolve) => setTimeout(() => resolve('pending'), 800)),
              ]);
              expect(early).toBe('pending');
              await page.evaluate(() => document.querySelector('.stop-button')?.remove());
              await expect(responsePromise).resolves.toContain('<invoke name="read_file">');
              await page.close();
            });
          });
          ''')
          PY
      - name: Clean install
        run: npm ci

name: Qwen Web hardening

on:
  push:
    branches:
      - feat/qwen-web-browser-provider
    paths:
      - .github/workflows/qwen-web-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen-web-browser-provider
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply browser hardening and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path); text = p.read_text(); count = text.count(old)
              if count != 1: raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))
          replace_once('packages/core/src/core/qwenWebContentGenerator/browserService.ts', "export interface QwenWebChannelSession {\n  prepare(model: string): Promise<QwenWebTransportState>;\n  reset(model: string): Promise<QwenWebTransportState>;\n  send(prompt: string, model: string): Promise<string>;\n}\n", "export interface QwenWebChannelSession {\n  prepare(model: string): Promise<QwenWebTransportState>;\n  reset(model: string): Promise<QwenWebTransportState>;\n  send(prompt: string, model: string): Promise<string>;\n}\n\nexport interface QwenWebBrowserController {\n  prepareChannel(channel: string, model: string, signal?: AbortSignal): Promise<QwenWebTransportState>;\n  newConversation(channel: string, model: string, signal?: AbortSignal): Promise<QwenWebTransportState>;\n  sendPrompt(channel: string, prompt: string, model: string, signal?: AbortSignal): Promise<string>;\n  stopGeneration(channel: string): Promise<void>;\n  close(): Promise<void>;\n}\n\nexport interface QwenWebBrowserServiceLike {\n  withChannel<T>(channel: string, signal: AbortSignal | undefined, operation: (session: QwenWebChannelSession) => Promise<T>): Promise<T>;\n}\n")
          replace_once('packages/core/src/core/qwenWebContentGenerator/browserService.ts', "export class QwenWebBrowserService {\n  private readonly controller: PuppeteerBrowserController;", "export class QwenWebBrowserService implements QwenWebBrowserServiceLike {\n  private readonly controller: QwenWebBrowserController;")
          replace_once('packages/core/src/core/qwenWebContentGenerator/browserService.ts', "  constructor(controller = new PuppeteerBrowserController()) {", "  constructor(controller: QwenWebBrowserController = new PuppeteerBrowserController()) {")
          replace_once('packages/core/src/core/qwenWebContentGenerator/qwenWebContentGenerator.ts', "  getQwenWebBrowserService,\n  type QwenWebBrowserService,\n} from './browserService.js';", "  getQwenWebBrowserService,\n  type QwenWebBrowserServiceLike,\n} from './browserService.js';")
          replace_once('packages/core/src/core/qwenWebContentGenerator/qwenWebContentGenerator.ts', "    private readonly browserService: QwenWebBrowserService =\n      getQwenWebBrowserService(),", "    private readonly browserService: QwenWebBrowserServiceLike =\n      getQwenWebBrowserService(),")
          replace_once('packages/core/src/core/qwenWebContentGenerator/browser/controller.ts', "    let entry = this.channels.get(channel);\n    if (!entry || entry.page.isClosed()) {\n      entry = await this.createChannelPage(model, signal);\n      this.channels.set(channel, entry);\n    } else if (entry.model !== model) {\n      await this.selectModel(entry.page, model);\n      entry.model = model;\n    }", "    let entry = this.channels.get(channel);\n    if (entry && !entry.page.isClosed()) {\n      const status = await this.status(entry.page).catch(() => undefined);\n      if (!status?.loggedIn) {\n        await entry.page.close().catch(() => undefined);\n        this.channels.delete(channel);\n        await this.reauthenticate(signal);\n        entry = undefined;\n      }\n    }\n    if (!entry || entry.page.isClosed()) {\n      entry = await this.createChannelPage(model, signal);\n      this.channels.set(channel, entry);\n    } else if (entry.model !== model) {\n      await this.selectModel(entry.page, model);\n      entry.model = model;\n    }")
          replace_once('packages/core/src/core/qwenWebContentGenerator/browser/controller.ts', "  private async authenticate(signal?: AbortSignal): Promise<void> {", "  private async reauthenticate(signal?: AbortSignal): Promise<void> {\n    if (this.authPromise) { await this.authPromise; return; }\n    this.authPromise = this.authenticate(signal).finally(() => { this.authPromise = undefined; });\n    await this.authPromise;\n  }\n\n  private async authenticate(signal?: AbortSignal): Promise<void> {")
          replace_once('packages/core/src/core/qwenWebContentGenerator/browser/controller.ts', "      throw new Error('Qwen Web session is no longer authenticated. Restart the request to sign in again.');", "      await this.reauthenticate(signal);\n      return this.createChannelPage(model, signal);")
          replace_once('packages/core/src/core/qwenWebContentGenerator/browser/pageRuntime.ts', "        if (nativeToolVisible() && !response.text.includes('<invoke')) {", "        if (nativeToolVisible()) {")
          Path('packages/core/src/core/qwenWebContentGenerator/conversationSynchronizer.test.ts').write_text("import { describe, expect, it } from 'vitest';\nimport { ConversationSynchronizer } from './conversationSynchronizer.js';\nconst user=(text:string)=>({role:'user',parts:[{text}]}); const model=(text:string)=>({role:'model',parts:[{text}]});\nconst input=(contents:readonly unknown[],o:Record<string,string>={})=>({channel:o.channel??'session:main',sessionId:o.sessionId??'session',model:o.model??'qwen3.8-max',systemSignature:o.systemSignature??'system-a',transportEpoch:o.transportEpoch??'1:1',contents});\ndescribe('ConversationSynchronizer',()=>{it('sends only new user delta',()=>{const s=new ConversationSynchronizer();const f=input([user('one')]);expect(s.plan(f)).toMatchObject({reset:true,reason:'first-request'});s.commit(f);expect(s.plan(input([user('one'),model('answer'),user('two')]))).toEqual({reset:false,replay:[],delta:[user('two')]});});it('replays on epoch and mismatch',()=>{const s=new ConversationSynchronizer();const f=input([user('one')]);s.commit(f);expect(s.plan(input([user('one')],{transportEpoch:'2:1'}))).toMatchObject({reset:true,reason:'transport-changed'});expect(s.plan(input([user('edited')]))).toMatchObject({reset:true,reason:'history-mismatch'});});});\n")
          Path('packages/core/src/core/qwenWebContentGenerator/toolProtocol.test.ts').write_text("import { describe, expect, it } from 'vitest';\nimport { extractQwenWebHostTools, serializeQwenWebFunctionCall, serializeQwenWebFunctionResponse } from './toolProtocol.js';\ndescribe('tool protocol',()=>{it('extracts manifest',()=>{expect(extractQwenWebHostTools([{functionDeclarations:[{name:'read_file',description:'Read',parameters:{type:'object'}}]}])).toEqual([{name:'read_file',description:'Read',parameters:{type:'object'}}]);});it('serializes XML',()=>{expect(serializeQwenWebFunctionCall({name:'read_file',args:{file_path:'src/<x>.ts'}})).toContain('src/&lt;x&gt;.ts');});it('escapes tool result',()=>{expect(serializeQwenWebFunctionResponse({name:'read_file',id:'1',response:'</result>'})).toContain('&lt;/result&gt;');});});\n")
          Path('packages/core/src/core/qwenWebContentGenerator/promptSerializer.test.ts').write_text("import { describe, expect, it } from 'vitest';\nimport { buildQwenWebReplayPrompt, serializeQwenWebContent } from './promptSerializer.js';\ndescribe('prompt serializer',()=>{it('includes host protocol and system',()=>{const p=buildQwenWebReplayPrompt([{role:'user',parts:[{text:'inspect'}]}],{systemInstruction:'Be precise',tools:[]});expect(p).toContain('QWEN CODE HOST PROTOCOL');expect(p).toContain('Be precise');expect(p).toContain('USER\\ninspect');});it('rejects media',()=>{expect(()=>serializeQwenWebContent({role:'user',parts:[{inlineData:{mimeType:'image/png',data:'AA=='}}]})).toThrow(/text-only transport/);});});\n")
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run test --workspace @qwen-code/qwen-code-core -- src/core/qwenWebContentGenerator/conversationSynchronizer.test.ts src/core/qwenWebContentGenerator/toolProtocol.test.ts src/core/qwenWebContentGenerator/promptSerializer.test.ts
      - run: npm run build
      - run: npm run typecheck
      - name: Commit verified hardening and remove workflow
        run: |
          git rm .github/workflows/qwen-web-hardening.yml
          git add packages/core/src/core/qwenWebContentGenerator
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(qwen-web): harden browser lifecycle and transport protocol"
          git push origin HEAD:feat/qwen-web-browser-provider

name: Qwen Web Stage 1 Model Contract

on:
  push:
    branches:
      - work/stage1-model-contract

permissions:
  contents: write

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/stage1-model-contract
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Stage 1 model contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          constants = Path('packages/core/src/models/constants.ts')
          text = constants.read_text()
          text = replace_once(
              text,
              """/**
           * Hard-coded Qwen OAuth models that are always available.
           * These cannot be overridden by user configuration.
           */
          export const QWEN_OAUTH_MODELS: ModelConfig[] = [""",
              """/**
           * Hard-coded Qwen Web models. The browser transport is deliberately
           * text-only in v1, even when a similarly named API model supports
           * richer modalities.
           */
          export const QWEN_WEB_MODELS: ModelConfig[] = [
            {
              id: QWEN_WEB_DEFAULT_MODEL,
              name: QWEN_WEB_DEFAULT_MODEL,
              description: 'Qwen 3.8 Max via Qwen Web browser session',
              capabilities: {},
              generationConfig: { modalities: {} },
            },
          ];

          /**
           * Hard-coded Qwen OAuth models that are always available.
           * These cannot be overridden by user configuration.
           */
          export const QWEN_OAUTH_MODELS: ModelConfig[] = [""",
              'constants',
          )
          constants.write_text(text)

          registry = Path('packages/core/src/models/modelRegistry.ts')
          text = registry.read_text()
          for old, new, label in [
              ("import { QWEN_OAUTH_MODELS } from './constants.js';", "import {\n  QWEN_OAUTH_MODELS,\n  QWEN_WEB_DEFAULT_MODEL,\n  QWEN_WEB_MODELS,\n} from './constants.js';", 'registry import'),
              ("export { QWEN_OAUTH_MODELS } from './constants.js';", "export { QWEN_OAUTH_MODELS, QWEN_WEB_MODELS } from './constants.js';", 'registry export'),
              ("    // Always register qwen-oauth models (hard-coded, cannot be overridden)\n    this.registerAuthTypeModels(AuthType.QWEN_OAUTH, QWEN_OAUTH_MODELS);", "    // Built-in Qwen models are hard-coded and cannot be overridden.\n    this.registerAuthTypeModels(AuthType.QWEN_OAUTH, QWEN_OAUTH_MODELS);\n    this.registerAuthTypeModels(AuthType.QWEN_WEB, QWEN_WEB_MODELS);", 'registry built-ins'),
              ("      // qwen-oauth uses hard-coded models and cannot be overridden\n      if (protocol === AuthType.QWEN_OAUTH) {", "      // Built-in Qwen providers use hard-coded models and cannot be overridden.\n      if (\n        protocol === AuthType.QWEN_OAUTH ||\n        protocol === AuthType.QWEN_WEB\n      ) {", 'registry override guard'),
              ("    if (authType === AuthType.QWEN_OAUTH) {\n      return this.getModel(authType, DEFAULT_QWEN_MODEL);\n    }", "    if (authType === AuthType.QWEN_OAUTH) {\n      return this.getModel(authType, DEFAULT_QWEN_MODEL);\n    }\n    if (authType === AuthType.QWEN_WEB) {\n      return this.getModel(authType, QWEN_WEB_DEFAULT_MODEL);\n    }", 'registry default'),
              ("   * Preserves hard-coded qwen-oauth models.", "   * Preserves hard-coded Qwen OAuth and Qwen Web models.", 'registry reload comment'),
          ]:
              text = replace_once(text, old, new, label)
          registry.write_text(text)

          resolver = Path('packages/core/src/models/modelConfigResolver.ts')
          text = resolver.read_text()
          text = replace_once(text, "  // Get auth-specific env var mappings.\n", "  const isQwenWeb = authType === AuthType.QWEN_WEB;\n\n  // Get auth-specific env var mappings.\n", 'resolver qwen-web flag')
          for old, new, label in [
              ("  if (authType && modelProvider?.envKey) {", "  if (!isQwenWeb && authType && modelProvider?.envKey) {", 'resolver provider key'),
              ("  if (cli?.apiKey) {", "  if (!isQwenWeb && cli?.apiKey) {", 'resolver cli key'),
              ("  for (const envKey of envMapping.apiKey) {\n    apiKeyLayers.push(envLayer(env, envKey));\n  }\n  if (settings?.apiKey) {", "  if (!isQwenWeb) {\n    for (const envKey of envMapping.apiKey) {\n      apiKeyLayers.push(envLayer(env, envKey));\n    }\n  }\n  if (!isQwenWeb && settings?.apiKey) {", 'resolver env/settings key'),
              ("  if (authType && modelProvider?.baseUrl) {", "  if (!isQwenWeb && authType && modelProvider?.baseUrl) {", 'resolver provider base url'),
              ("  if (cli?.baseUrl) {", "  if (!isQwenWeb && cli?.baseUrl) {", 'resolver cli base url'),
              ("  for (const envKey of envMapping.baseUrl) {\n    baseUrlLayers.push(envLayer(env, envKey));\n  }\n  if (settings?.baseUrl) {", "  if (!isQwenWeb) {\n    for (const envKey of envMapping.baseUrl) {\n      baseUrlLayers.push(envLayer(env, envKey));\n    }\n  }\n  if (!isQwenWeb && settings?.baseUrl) {", 'resolver env/settings base url'),
              ("  if (authType && modelProvider?.envKey) {\n    apiKeyEnvKey = modelProvider.envKey;", "  if (!isQwenWeb && authType && modelProvider?.envKey) {\n    apiKeyEnvKey = modelProvider.envKey;", 'resolver env key metadata'),
          ]:
              text = replace_once(text, old, new, label)

          marker = "\n  return result;\n}"
          pos = text.rfind(marker)
          if pos < 0:
              raise SystemExit('resolver return anchor not found')
          qwen_web_modalities = """

          // Qwen Web v1 transports text through the browser DOM only. Override
          // generic model-name detection and any settings/provider declaration so
          // callers cannot advertise media that this transport cannot carry.
          if (authType === AuthType.QWEN_WEB) {
            result.modalities = {};
            sources['modalities'] = computedSource(
              'qwen-web browser transport is text-only',
            );
          }
          """
          text = text[:pos] + qwen_web_modalities + text[pos:]
          resolver.write_text(text)

          Path('packages/core/src/models/qwenWebModelContract.test.ts').write_text(r'''/**
           * @license
           * Copyright 2025 Qwen Team
           * SPDX-License-Identifier: Apache-2.0
           */

          import { describe, expect, it } from 'vitest';
          import { AuthType } from '../core/contentGenerator.js';
          import { QWEN_WEB_DEFAULT_MODEL, QWEN_WEB_MODELS } from './constants.js';
          import { ModelRegistry } from './modelRegistry.js';
          import { resolveModelConfig, validateModelConfig } from './modelConfigResolver.js';

          describe('Qwen Web model contract', () => {
            it('registers qwen3.8-max as the built-in text-only model', () => {
              const registry = new ModelRegistry();
              const models = registry.getModelsForAuthType(AuthType.QWEN_WEB);
              expect(models).toHaveLength(QWEN_WEB_MODELS.length);
              expect(models[0]?.id).toBe(QWEN_WEB_DEFAULT_MODEL);
              expect(models[0]?.modalities).toEqual({});
              expect(models[0]?.isVision).toBe(false);
              expect(registry.getDefaultModelForAuthType(AuthType.QWEN_WEB)?.id).toBe(QWEN_WEB_DEFAULT_MODEL);
            });

            it('does not let modelProviders override the built-in Qwen Web model set', () => {
              const registry = new ModelRegistry({
                'qwen-web': [{ id: 'not-supported', generationConfig: { modalities: { image: true } } }],
              });
              expect(registry.getModel(AuthType.QWEN_WEB, 'not-supported')).toBeUndefined();
              expect(registry.getModel(AuthType.QWEN_WEB, QWEN_WEB_DEFAULT_MODEL)?.generationConfig.modalities).toEqual({});
            });

            it('resolves the default without API credentials or a base URL', () => {
              const result = resolveModelConfig({
                authType: AuthType.QWEN_WEB,
                cli: { apiKey: 'must-be-ignored', baseUrl: 'https://must-be-ignored.invalid' },
                settings: { apiKey: 'also-ignored', baseUrl: 'https://also-ignored.invalid' },
                env: {},
              });
              expect(result.config.model).toBe(QWEN_WEB_DEFAULT_MODEL);
              expect(result.config.apiKey).toBeUndefined();
              expect(result.config.apiKeyEnvKey).toBeUndefined();
              expect(result.config.baseUrl).toBeUndefined();
              expect(result.config.modalities).toEqual({});
            });

            it('forces text-only modalities even when settings request images', () => {
              const result = resolveModelConfig({
                authType: AuthType.QWEN_WEB,
                settings: { generationConfig: { modalities: { image: true } } },
                env: {},
              });
              expect(result.config.modalities).toEqual({});
              expect(result.sources['modalities']?.kind).toBe('computed');
            });

            it('ignores model-provider credentials and media declarations', () => {
              const result = resolveModelConfig({
                authType: AuthType.QWEN_WEB,
                env: { SHOULD_NOT_BE_USED: 'secret' },
                modelProvider: {
                  id: QWEN_WEB_DEFAULT_MODEL,
                  envKey: 'SHOULD_NOT_BE_USED',
                  baseUrl: 'https://must-not-be-used.invalid',
                  generationConfig: { modalities: { image: true } },
                },
              });
              expect(result.config.apiKey).toBeUndefined();
              expect(result.config.apiKeyEnvKey).toBeUndefined();
              expect(result.config.baseUrl).toBeUndefined();
              expect(result.config.modalities).toEqual({});
            });

            it('preserves an explicit model request instead of silently falling back', () => {
              const result = resolveModelConfig({ authType: AuthType.QWEN_WEB, cli: { model: 'explicit-future-model' }, settings: {}, env: {} });
              expect(result.config.model).toBe('explicit-future-model');
            });

            it('validates qwen-web without an API key but still requires a model', () => {
              expect(validateModelConfig({ authType: AuthType.QWEN_WEB, model: QWEN_WEB_DEFAULT_MODEL }).valid).toBe(true);
              const missingModel = validateModelConfig({ authType: AuthType.QWEN_WEB, model: '' });
              expect(missingModel.valid).toBe(false);
              expect(missingModel.errors.some((error) => error.message.toLowerCase().includes('model'))).toBe(true);
            });
          });
          ''')
          PY
      - name: Format Stage 1 files
        run: npx prettier --write packages/core/src/models/constants.ts packages/core/src/models/modelRegistry.ts packages/core/src/models/modelConfigResolver.ts packages/core/src/models/qwenWebModelContract.test.ts
      - name: Clean install
        run: npm ci
      - name: Focused Stage 1 tests
        run: npm -w packages/core test -- src/models/qwenWebModelContract.test.ts
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Commit Stage 1 product and tests
        run: |
          git config user.name "go-0dboy"
          git config user.email "84291994+go-0dboy@users.noreply.github.com"
          git add packages/core/src/models/constants.ts \
                  packages/core/src/models/modelRegistry.ts \
                  packages/core/src/models/modelConfigResolver.ts \
                  packages/core/src/models/qwenWebModelContract.test.ts
          git commit -m "fix(qwen-web): define credentialless text-only model contract"
          git push origin HEAD:work/stage1-model-contract

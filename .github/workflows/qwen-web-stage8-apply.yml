name: Qwen Web Stage 8 Apply

on:
  push:
    branches:
      - feat/qwen-web-browser-provider
    paths:
      - .github/workflows/qwen-web-stage8-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen-web-browser-provider
          fetch-depth: 0
      - name: Normalize Stage 8 patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_qwen_web_stage8.py')
          text = p.read_text()
          old = '    if count != 1:\n        raise SystemExit(\n            f"{path}: expected one anchor, found {count}: {old[:80]!r}"\n        )'
          new = '    if count < 1:\n        raise SystemExit(\n            f"{path}: anchor not found: {old[:80]!r}"\n        )'
          if old not in text:
              raise SystemExit('replace_one guard anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply Stage 8 patch
        run: python3 .github/scripts/apply_qwen_web_stage8.py
      - name: Complete useAuth dependency patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/cli/src/ui/auth/useAuth.ts')
          text = p.read_text()
          old = '''    [
                setAuthState,
                onAuthError,
                closeAuthDialog,
                handleProviderSubmit,
                openAuthDialog,
                cancelAuthentication,
              ],'''.replace('        ', '')
          new = '''    [
                setAuthState,
                onAuthError,
                closeAuthDialog,
                handleProviderSubmit,
                handleQwenWebSubmit,
                openAuthDialog,
                cancelAuthentication,
              ],'''.replace('        ', '')
          if text.count(old) != 1:
              raise SystemExit(f'useAuth dependency anchor count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit Stage 8
        run: |
          git config user.name qwen-web-bot
          git config user.email qwen-web-bot@users.noreply.github.com
          git add packages/core/src/models/index.ts packages/core/src/index.ts \
            packages/cli/src/ui/auth/useAuth.ts \
            packages/cli/src/ui/auth/AuthDialog.tsx \
            packages/cli/src/ui/auth/AuthDialog.test.tsx \
            packages/cli/src/ui/auth/qwenWebAuth.ts \
            packages/cli/src/ui/auth/qwenWebAuth.test.ts \
            packages/cli/src/ui/components/AppHeader.tsx \
            packages/cli/src/ui/opentui/dialogs-auth.tsx
          git diff --cached --check
          git commit -m "feat(qwen-web): add credentialless auth UI"
          git push origin HEAD:feat/qwen-web-browser-provider
